<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Digital Flow Tank</title>
    <link rel="icon" href="data:," />
    <style>
      :root {
        --bg: #05090f;
        --ink: #c9d6e6;
        --dim: #6f8298;
        --pos: #3d8bff;
        --neg: #ef3e6d;
        --piv: #7cff6b;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: var(--ink);
        font: 12px/1.45 ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
        overflow: hidden;
      }
      #app {
        position: fixed;
        inset: 0;
      }
      #app canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      .panel {
        position: fixed;
        padding: 10px 12px;
        background: rgba(5, 9, 15, 0.62);
        border: 1px solid rgba(143, 179, 224, 0.14);
        border-radius: 8px;
        backdrop-filter: blur(6px);
        pointer-events: none;
        white-space: pre;
      }
      #hud {
        top: 12px;
        left: 12px;
      }
      #hud .title {
        color: #eaf2ff;
        font-weight: 600;
        letter-spacing: 0.04em;
        margin-bottom: 4px;
      }
      #hud .k {
        color: var(--dim);
      }
      #legend {
        bottom: 12px;
        left: 12px;
      }
      #legend .sw {
        display: inline-block;
        width: 10px;
        height: 10px;
        border-radius: 50%;
        margin-right: 6px;
        vertical-align: -1px;
      }
      #keys {
        bottom: 12px;
        right: 12px;
        color: var(--dim);
      }
      body.nohud .panel {
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="hud" class="panel"></div>
    <div id="legend" class="panel"></div>
    <div id="keys" class="panel"></div>
    <script type="module" src="/src/sim/flowtank/demo.ts"></script>
  </body>
</html>
